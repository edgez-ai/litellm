name: Build and Push LiteLLM Database Image

on:
  workflow_dispatch:
    inputs:
      branch:
        description: LiteLLM branch to build
        required: true
        default: litellm_deepseek_v4_pro_codex_adapter
        type: string

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false

      - name: Resolve image tag
        id: image
        shell: bash
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          safe_branch="$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_.-]/-/g; s/^[.-]//')"
          if [ -z "$safe_branch" ]; then
            echo "::error::Branch name does not produce a valid Docker tag"
            exit 1
          fi
          short_sha="$(git rev-parse --short=12 HEAD)"
          echo "tag=${safe_branch:0:114}-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Login to Docker Hub
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./docker/Dockerfile.database
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/litellm-database:${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
